name: Samodejna dnevna osvežitev tečajev in validacija SBI TOP (LJSE & Yahoo Finance)

on:
  schedule:
    # Zimski čas (CET = UTC+1): 16:30 UTC = 17:30 CET po zaključku trgovanja na LJSE
    - cron: '30 16 * * 1-5'
    # Poletni čas (CEST = UTC+2): 15:30 UTC = 17:30 CEST po zaključku trgovanja na LJSE
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'

permissions:
  contents: write

jobs:
  daily-price-refresh-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem izvorne kode
        uses: actions/checkout@v4

      - name: Nastavitev okolja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Namestitev knjižnice yfinance za tuje vrstnike in DAX 40
        run: pip install yfinance

      - name: Zajem dnevnih zaključnih tečajev z LJSE (9 družb) in 68 tujih vrstnikov
        run: python3 scripts/fetch_daily_market_data.py

      - name: Preračun vseh kazalnikov vrednotenj (P/E, P/B, EV/EBITDA, MoS, IV) in arhiviranje IV
        run: python3 scripts/build_dataset.py

      - name: Matematična in podatkovna validacija (11 kontrolnih točk)
        run: python3 scripts/validate.py

      - name: Preverba sintakse app.js (Node.js)
        run: node --check app.js

      - name: Objava posodobljenih dnevnih tečajev in kazalnikov na GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/companies_raw.json data/raw/peers_yfinance.json data/sbitop_data.json data/sbitop_data.js data/iv_history.json
          git diff --staged --quiet || git commit -m "chore(data): dnevna osvežitev borznih tečajev LJSE in preračun kazalnikov SBI TOP"
          git push
