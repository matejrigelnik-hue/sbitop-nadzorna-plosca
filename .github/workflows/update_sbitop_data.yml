name: Samodejna gradnja in validacija podatkov SBI TOP (LJSE & SEOnet)

on:
  schedule:
    # Zimski čas (CET = UTC+1): 16:30 UTC = 17:30 CET po zaključku trgovanja na LJSE
    - cron: '30 16 * * 1-5'
    # Poletni čas (CEST = UTC+2): 15:30 UTC = 17:30 CEST po zaključku trgovanja na LJSE
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'data/raw/**'

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Prevzem izvorne kode
        uses: actions/checkout@v4

      - name: Nastavitev okolja Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gradnja podatkovne baze iz data/raw/ in arhiviranje IV
        run: python3 scripts/build_dataset.py

      - name: Matematična in podatkovna validacija (11 kontrolnih točk)
        run: python3 scripts/validate.py

      - name: Preverba sintakse app.js (Node.js)
        run: node --check app.js

      - name: Objava posodobljenih podatkov v repozitorij
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sbitop_data.json data/sbitop_data.js data/iv_history.json
          git diff --staged --quiet || git commit -m "chore(data): regeneracija in validacija podatkovne baze SBI TOP"
          git push
